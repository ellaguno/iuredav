[package]
name = "iuredav-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IureDav: monta tu instancia de Iurefficient como una unidad del sistema"

[lib]
name = "iuredav_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
iuredav-core = { path = "../crates/iuredav-core" }
iurefficient-connect.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Solo para retirar la barra de titulo rota que tao 0.35 pone en Wayland; ver
# `barra_de_titulo_de_gtk` en lib.rs. La version es la misma que usa tao.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
