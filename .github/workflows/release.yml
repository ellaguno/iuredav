name: Publicar release

# Se dispara al empujar una etiqueta como v0.2.0. El proceso completo es:
#
#   python3 scripts/version.py 0.2.0
#   git commit -am "Version 0.2.0"
#   git tag -a v0.2.0 -m "IureDav 0.2.0" && git push --follow-tags
#
# Lo primero que hace es comprobar que la etiqueta y la version de los ficheros
# coincidan: publicar un instalador que dice una version y lleva otra es peor que
# no publicar nada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta ya existente que quieres volver a publicar"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preparar:
    name: Preparar la release
    runs-on: ubuntu-22.04
    outputs:
      etiqueta: ${{ steps.datos.outputs.etiqueta }}
      version: ${{ steps.datos.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: La etiqueta tiene que coincidir con la version del codigo
        id: datos
        run: |
          etiqueta="${{ github.event.inputs.etiqueta || github.ref_name }}"
          version="${etiqueta#v}"
          echo "etiqueta=$etiqueta" >> "$GITHUB_OUTPUT"
          echo "version=$version"  >> "$GITHUB_OUTPUT"

          python3 scripts/version.py
          en_ficheros=$(python3 scripts/version.py | tail -1 | awk '{print $NF}')
          if [ "$en_ficheros" != "$version" ]; then
            echo "::error::la etiqueta dice $version y los ficheros dicen $en_ficheros"
            echo "Ejecuta: python3 scripts/version.py $version"
            exit 1
          fi
          echo "etiqueta $etiqueta coherente con el codigo"

      - name: Crear el borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta="${{ steps.datos.outputs.etiqueta }}"
          if gh release view "$etiqueta" >/dev/null 2>&1; then
            echo "la release ya existe; se reutiliza"
            exit 0
          fi

          # El cuerpo sale del CHANGELOG si tiene una seccion para esta version.
          notas=$(python3 scripts/notas-release.py "${{ steps.datos.outputs.version }}")
          gh release create "$etiqueta" \
            --draft \
            --title "IureDav $etiqueta" \
            --notes "$notas"

  empaquetar:
    name: ${{ matrix.nombre }}
    needs: preparar
    strategy:
      fail-fast: false
      matrix:
        include:
          # `asset`: sufijo con el que se publican los instaladores. GitHub los lista
          # por nombre (orden ASCII): el numero deja Windows, macOS y Linux en ese orden.
          - nombre: Linux x86_64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            asset: 3-linux-x64
          - nombre: macOS (Intel y Apple Silicon)
            os: macos-14
            triple: universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset: 2-macos-universal
          - nombre: Windows x86_64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            asset: 1-windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets || matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.triple }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Descargar rclone para ${{ matrix.triple }}
        run: python3 scripts/descargar-rclone.py --objetivo ${{ matrix.triple }}

      # El instalador de Windows lleva dentro el MSI de WinFsp (ver windows/hooks.nsh).
      - name: Descargar WinFsp
        if: startsWith(matrix.os, 'windows')
        run: python3 scripts/descargar-winfsp.py

      - name: Construir
        env:
          # Firma de los artefactos del actualizador (.sig). Sin estos secretos la
          # compilación falla: son obligatorios en cuanto tauri.conf.json declara pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.triple }}

      # --- Firma Authenticode (Windows) con SignPath -------------------------------
      # Solo se activa cuando existen el token (secreto SIGNPATH_API_TOKEN) y los
      # identificadores del proyecto (variables SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG y SIGNPATH_SIGNING_POLICY_SLUG). Sin ellos se publica
      # sin firmar, como hasta ahora. SignPath recibe los instaladores como artefacto
      # de esta ejecucion, los firma con el certificado de SignPath Foundation tras
      # la aprobacion manual y los devuelve; la firma Authenticode cambia los bytes,
      # asi que la firma minisign del actualizador (.sig) se rehace despues.
      - name: Instaladores de Windows por firmar
        id: sin_firmar
        if: startsWith(matrix.os, 'windows') && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          mkdir -p sin-firmar
          find "target/${{ matrix.triple }}/release/bundle" -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp {} sin-firmar/ \;
          ls -la sin-firmar
          echo "hay=$(ls sin-firmar | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Subir los instaladores como artefacto para SignPath
        id: artefacto_sin_firmar
        if: steps.sin_firmar.outputs.hay != '' && steps.sin_firmar.outputs.hay != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sin-firmar-${{ matrix.asset }}
          path: sin-firmar/*
          retention-days: 3

      - name: Firmar con SignPath
        id: signpath
        if: steps.artefacto_sin_firmar.outputs.artifact-id != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artefacto_sin_firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmados

      - name: Sustituir por los firmados y rehacer la firma del actualizador
        if: steps.signpath.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          base="target/${{ matrix.triple }}/release/bundle"
          n=0
          for firmado in $(find firmados -type f \( -name '*.exe' -o -name '*.msi' \)); do
            nombre="$(basename "$firmado")"
            destino="$(find "$base" -type f -name "$nombre" | head -1)"
            if [ -z "$destino" ]; then
              echo "::error::SignPath devolvio $nombre pero no existe en $base"
              exit 1
            fi
            cp "$firmado" "$destino"
            if [ -f "$destino.sig" ]; then
              npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$destino"
            fi
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::SignPath no devolvio ningun instalador"
            exit 1
          fi
          echo "$n instaladores firmados"

      - name: Adjuntar los instaladores a la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preparar.outputs.version }}
        run: |
          base="target/${{ matrix.triple }}/release/bundle"
          mkdir -p dist-release

          # Se copian con nombre uniforme: IureDav_<version>_<orden>-<plataforma>.<ext>.
          # Nada de `mapfile` aqui: macOS trae bash 3.2 —de 2007, por el cambio de
          # licencia a GPLv3— y `mapfile` es de bash 4.
          n=0
          while IFS= read -r -d '' fichero; do
            nombre="$(basename "$fichero")"
            case "$nombre" in
              *.app.tar.gz.sig) ext="app.tar.gz.sig" ;;
              *.app.tar.gz)     ext="app.tar.gz" ;;
              *.AppImage.sig)   ext="AppImage.sig" ;;
              *.exe.sig)        ext="exe.sig" ;;
              *.msi.sig)        ext="msi.sig" ;;
              *.deb.sig)        ext="deb.sig" ;;
              *.rpm.sig)        ext="rpm.sig" ;;
              *)                ext="${nombre##*.}" ;;
            esac
            cp "$fichero" "dist-release/IureDav_${VERSION}_${{ matrix.asset }}.${ext}"
            n=$((n + 1))
          done < <(find "$base" -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.sig' -o -name '*.app.tar.gz' \) -print0)

          if [ "$n" -eq 0 ]; then
            echo "::error::no se genero ningun instalador en $base"
            exit 1
          fi

          ls -la dist-release
          gh release upload "${{ needs.preparar.outputs.etiqueta }}" dist-release/* --clobber

  # Manifiesto del actualizador (latest.json): una entrada por plataforma con la
  # firma de su instalador. macOS es universal: la misma entrada para ambas arquitecturas.
  manifiesto:
    needs: [preparar, empaquetar]
    runs-on: ubuntu-22.04
    steps:
      - name: Generar y subir latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ needs.preparar.outputs.etiqueta }}
        run: |
          mkdir -p firmas && cd firmas
          gh release download "$ETIQUETA" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' || true
          cd ..
          python3 - <<'PY'
          import json, os, glob, datetime
          tag = os.environ["ETIQUETA"]; version = tag.lstrip("v")
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          platforms = {}
          for sig in glob.glob("firmas/*.sig"):
              asset = os.path.basename(sig)[:-4]
              entry = {"url": base + asset, "signature": open(sig).read().strip()}
              if asset.endswith(".AppImage"):
                  platforms["linux-x86_64"] = entry
              elif asset.endswith(".exe"):
                  platforms["windows-x86_64"] = entry
              elif asset.endswith(".app.tar.gz"):
                  platforms["darwin-aarch64"] = entry
                  platforms["darwin-x86_64"] = entry
          manifest = {"version": version, "notes": f"IureDav {version}",
                      "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "platforms": platforms}
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$ETIQUETA" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  publicar:
    name: Publicar
    needs: [preparar, empaquetar, manifiesto]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Sacar la release del borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta="${{ needs.preparar.outputs.etiqueta }}"
          gh release edit "$etiqueta" --draft=false --latest
          echo "publicada: $(gh release view "$etiqueta" --json url --jq .url)"
